# Default authority rules for conflict resolution (§12).
# For each predicate, sources earlier in the list are more authoritative.
# Authorities are free-form strings set on SourceReference.authority by connectors.
version: 1
# Human corrections (origin "user", §74) always win.
userOverrides: true
# What to do when a LOWER-authority source reports a DIFFERENT value that is NEWER than the
# best-authority value (e.g. 学務 9/1 says A, Teams instructor post 10/2 says B):
#   conflict  -> keep both and create a Conflict (default; the AI is told they disagree)
#   recency   -> trust the newer value
#   authority -> trust the higher authority
recencyOverride: conflict
# Facts below this confidence never override or conflict with better sources.
minConfidence: 0.5
predicates:
  room: [academic-system, instructor-announcement, syllabus]
  class_status: [academic-system, instructor-announcement, calendar]
  starts_at: [academic-system, instructor-announcement, calendar, syllabus]
  grade: [academic-system]
  grade_letter: [academic-system]
  # academic-system (学務) is listed so that a newer, different due date heard in a lecture
  # (transcript, origin extracted) opens a Conflict with it instead of being outranked silently;
  # transcript is last, so a recording never wins against a system that states the date.
  assignment_due:
    [submission-system, instructor-announcement, syllabus, academic-system, transcript]
  submission_status: [submission-system]
  exam_at: [academic-system, instructor-announcement, syllabus, transcript]
  deadline:
    [
      submission-system,
      instructor-announcement,
      syllabus,
      lms,
      collaboration,
      discussion,
      transcript,
    ]
# Predicates whose facts are separate items rather than competing values for one slot (a lecture
# can name several things to prepare): they are never turned into Conflicts.
multiValued: [todo]
# Used for predicates not listed above.
default:
  [
    academic-system,
    submission-system,
    instructor-announcement,
    lms,
    syllabus,
    calendar,
    collaboration,
    discussion,
    transcript,
    local-file,
  ]
