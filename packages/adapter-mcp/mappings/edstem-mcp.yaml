# EdStem (Ed Discussion) through the community `edstem-mcp` stdio server of bunizao/edstem-cli
# (MIT, https://github.com/bunizao/edstem-cli; UniContext adapter-mcp, spec §28). Tested against
# v0.7.2 (commit 50570fb8577577d9f73dd556f05dfbbf0e906ecd). There is no official EdStem MCP server.
#
# Read tools this mapping calls (all annotated readOnlyHint: true by the server). Results come back
# as one JSON text block:
#   list_courses({includeArchived})  -> [{id, code, name, year?, session?, status?, role?}]
#   list_threads({courseId, limit, sort})
#                                    -> [{id, number, title, type, category, courseId, subcategory?,
#                                         createdAt?, updatedAt?, metrics?: {replyCount?, ...},
#                                         flags?: ["pinned", "private", "answered", "unseen", ...]}]
#                                       type is "post" | "question" | "announcement"; no body, no author
#   get_thread({threadId})           -> the summary fields plus {userId, document, endorsement?,
#                                         users?: {"<userId>": {id, name, courseRole?, role?}},
#                                         answers?: [Comment], comments?: [Comment]}
#                                       Comment = {id, userId, document, createdAt?, endorsed?,
#                                         anonymous?, byStaff?, comments?: [Comment]} (nested replies)
#   list_lessons({courseId})         -> [{id, courseId, moduleId, title, moduleName?, type?, kind?,
#                                         state?, status?, slideCount?, availableAt?, dueAt?}]
#                                       status is the student's progress: "unattempted" |
#                                       "attempted" | "completed"; dueAt / availableAt are absolute
#                                       ISO timestamps from Ed's API (never local strings)
#   get_lesson({lessonId})           -> the summary plus {outline?, lockedAt?, createdAt?,
#                                         updatedAt?, slides?: [{id, index, title?, type?, status?,
#                                         content? (Ed document XML), fileUrl? (pdf slides)}]}
#                                       slide types seen: document, quiz, pdf, postgres (SQL
#                                       challenge, prompt in content), code, ...
#   list_slide_questions({slideId})  -> [{id, slideId, index, type, content (Ed XML), answers:
#                                         [choice], multipleSelection?, explanation?, solution?}]
#                                       the questions of a quiz slide (質問1, 質問2, ... in Ed's
#                                       order; `index` is 0- or 1-based depending on the course)
#   list_slide_responses({slideId})  -> [{questionId, userId, createdAt?, correct?, data: {content?
#                                         | choices?}}] the student's own saved answers (on request)
#   list_lesson_files({lessonId})    -> [{filename, url, mediaType?, slideId?, slideTitle?, source}]
#                                       Ed-hosted files of a lesson (on request)
# The server also offers write tools (create_thread, reply_thread, submit_slide, submit_slide_answer,
# mark_lessons_read, ...). They are never mapped here (§50); posting stays off unless
# EDSTEM_ALLOW_POSTING=1, which the UniContext source config must not set. Reading a quiz's
# questions or saved answers never views, saves or submits anything.
#
# Call budget: list_threads returns no body, so the opening post needs get_thread. To stay gentle
# with Ed, details are fetched only for announcements and for threads created or updated in the last
# 30 days; older details already stored stay as they were (the detail resource is not `complete`).
# Lessons: get_lesson for unfinished assignment lessons on every sync (their deadline is often only
# in the text); every other lesson, and the questions of each quiz slide, at most once a day per
# daemon process (forEach.refreshAfter). The student's saved answers and the lesson file list are
# read only on request (get_assignment / verify_submission -> `details`), never by a sync. A request
# also lists the course's lessons again (list_lessons, one call), so the lesson's progress, which is
# the submission state, is current right after the student submits.
#
# Lesson text for search: each lesson becomes a document (its slides' text in order), each quiz
# question a document titled 「<lesson> 質問<n>」 (with its choices), each Ed-hosted slide file
# (pdf slide) a document with its link — all tied to the course and cited with the Ed lesson URL.
# Answer keys (solution / explanation) are never mapped.
#
# Attachments: files written into text (<file url filename/>) of a lesson slide, of a thread post
# or of any answer / comment become documents too (path /Ed Lessons/… or /Ed Discussion/#<n> …);
# the pinned server has no thread file list tool, so text is where threads show their files.
# Their bytes are fetched on demand through the `files:` section (get_document); Ed lesson / question
# refs are labelled "Ed Lessons" in citations, threads keep "Ed Discussion".
#
# The student's own submitted files: files and images put into a saved answer (<file url
# filename/> and <image src/> in the response document) become documents too (edKind
# response-file, path /Ed Lessons/…/<lesson>/提出/…), only when the answers are read on request.
# Their bytes are fetched only when get_document opens one.
#
# Region: Ed accounts live in one region. The API host is the source env EDSTEM_BASE_URL (the
# server's default https://edstem.org/api/ is the AU region; US is https://us.edstem.org/api/) and
# the web links below are https://edstem.org/<region>/courses/... with <region> from `vars.region`
# (default au; set `mappingVars: { region: us }` in the source config for a US account). See
# docs/connectors/edstem.md.
#
# Course terms: Ed's `session` is free text typed by the course admin ("Semester 2", "S2",
# "Spring", or a placeholder such as "X"). $profileTerm maps it through the university profile's
# academic calendar onto the university's own term names (Semester 2 → 後期), so the offering can be
# identity-linked to the academic system's one (§14). A label that is not a term stays unknown (no
# `term`), never a wrong literal; the raw session is kept in extra.session. Ed's `year` is taken as
# the academic year (a 後期 course running Oct 2025 – Feb 2026 is year 2025).
#
# Lessons as assignments: Ed lessons that are work to hand in (title says 課題 / レポート / 宿題 /
# 提出 / テスト / quiz / assignment / homework / report, or Ed sets a due date) become assignments
# with Ed as the submission system: Ed's own dueAt (absolute) is the due date, availableAt the
# start. A lesson without any due date stays an assignment without one (期限不明), never dropped. Instructors at Shizuoka write the
# deadline into the lesson text instead (「提出期限: 10月6日 17:00PM」): get_lesson is fetched for
# unfinished assignment lessons and $extractDeadline turns that sentence into an assignment_due
# fact (origin extracted, the sentence as evidence). Wall-clock times in the text are read in the
# university's time zone (JST), not the AU server's. Without dueAt or such a sentence, the
# lesson's lockedAt (the hard close, from get_lesson) is the due date. The lesson's progress status
# is the submission state (completed → submitted, otherwise not_submitted).
#
# Authorities: discussion posts are `discussion`. Announcements and every post by course staff
# (Ed course roles admin / staff / ta / tutor) are instructor statements, `instructor-announcement`
# (§12). Student questions get isQuestion = true.
id: edstem
product: edstem
sourceLabel: Ed Discussion
description: EdStem discussion boards via the edstem-mcp server (courses, threads, answers, comments)
version: '6'
testedVersion: 0.7.2
defaultAuthority: discussion
capabilities: [courses, announcements, messages, assignments]
vars:
  region: au

# Files Ed hosts (slide PDFs, images and documents attached in lesson / thread text) are fetched on
# request (get_document, download_course_file) by a plain HTTPS GET of the document's url: only
# these hosts, no cookie or token, no redirect, capped size. Nothing else of Ed is ever contacted
# for a file (Ed file links open without signing in).
files:
  hostAllowlist: ['edusercontent.com', '*.edusercontent.com']
  credentials: none
  maxBytes: 52428800

resources:
  - name: courses
    call: { tool: list_courses, args: { includeArchived: false } }
    select: '$'
    sourceType: edstem.course
    externalId: '$string(id)'
    # Archived courses drop out of this list; keep them (and their threads) instead of deleting.
    complete: false
    capability: courses

  - name: threads
    forEach: { resource: courses, as: course }
    call:
      tool: list_threads
      args: { courseId: '{{course.id}}', limit: 50, sort: new }
    select: '$'
    sourceType: edstem.thread
    externalId: '$string(id)'
    updatedAt: 'updatedAt ? updatedAt : createdAt'
    capability: messages

  # Bodies, answers and comments: one call per announcement or recently active thread.
  - name: thread_details
    forEach:
      resource: threads
      as: thread
      where: >-
        type = "announcement" or
        $toMillis(updatedAt ? updatedAt : createdAt) >= $toMillis($now()) - 2592000000
    call:
      tool: get_thread
      args: { threadId: '{{thread.id}}' }
    select: '$'
    sourceType: edstem.thread_detail
    externalId: '$string(id)'
    updatedAt: 'updatedAt ? updatedAt : createdAt'
    optional: true
    capability: messages

  # Lessons (Ed's lesson modules: slides, quizzes, 当日課題).
  - name: lessons
    forEach: { resource: courses, as: course }
    call:
      tool: list_lessons
      args: { courseId: '{{course.id}}' }
    select: '$'
    sourceType: edstem.lesson
    externalId: '$string(id)'
    optional: true
    capability: assignments

  # On request only (get_assignment / verify_submission): the lessons of the requested lesson's
  # course again, so its progress (= the submission state) is current. Metadata only, one call.
  - name: lesson_status
    onRequest: true
    forEach: { resource: lessons, as: lesson }
    call:
      tool: list_lessons
      args: { courseId: '{{lesson.courseId}}' }
    select: '$'
    sourceType: edstem.lesson
    externalId: '$string(id)'
    optional: true
    capability: assignments

  # Every lesson's slides (text, quiz slide ids, slide files). Unfinished assignment lessons on
  # every sync (the deadline is often only written there), every other lesson at most once a day.
  - name: lesson_details
    forEach:
      resource: lessons
      as: lesson
      refreshAfter: 24h
      always: >-
        $not(status = "completed") and
        ($exists(dueAt) or
        $contains(title, /課題|レポート|宿題|提出|テスト|クイズ|quiz|assignment|homework|report/i))
    call:
      tool: get_lesson
      args: { lessonId: '{{lesson.id}}' }
    select: '$'
    sourceType: edstem.lesson_detail
    externalId: '$string(id)'
    attach: { moduleName: 'lesson.moduleName' }
    optional: true
    capability: assignments

  # The questions of each quiz slide (質問1, 質問2, ...), numbered in Ed's order. At most once a day
  # per slide; new lessons are read on first sight.
  - name: slide_questions
    forEach:
      resource: lesson_details
      as: slide
      expand: &quizSlides >-
        ($l := $; $n := $count($l.slides[type = "quiz"]);
        $l.slides[type = "quiz"].{"slideId": id, "slideTitle": title, "lessonId": $l.id,
        "courseId": $l.courseId, "lessonTitle": $l.title, "moduleName": $l._parent.moduleName,
        "quizSlides": $n})
      refreshAfter: 24h
    call:
      tool: list_slide_questions
      args: { slideId: '{{slide.slideId}}' }
    select: >-
      $map($sort($, function($a, $b) { $a.index > $b.index }),
      function($q, $i) { $merge([$q, {"number": $i + 1}]) })
    sourceType: edstem.slide_question
    externalId: '$string(id)'
    attach: &quizSlideContext
      lessonId: slide.lessonId
      slideId: slide.slideId
      courseId: slide.courseId
      lessonTitle: slide.lessonTitle
      slideTitle: slide.slideTitle
      moduleName: slide.moduleName
      quizSlides: slide.quizSlides
    optional: true
    capability: assignments

  # On request only (get_assignment): the student's own saved answers of each quiz slide.
  - name: slide_responses
    onRequest: true
    forEach:
      resource: lesson_details
      as: slide
      expand: *quizSlides
    call:
      tool: list_slide_responses
      args: { slideId: '{{slide.slideId}}' }
    select: '$'
    sourceType: edstem.slide_response
    externalId: '$string(questionId)'
    attach: *quizSlideContext
    optional: true
    capability: assignments

  # On request only (get_assignment): Ed-hosted files of the lesson (slide files and links in text).
  - name: lesson_files
    onRequest: true
    forEach: { resource: lessons, as: lesson }
    call:
      tool: list_lesson_files
      args: { lessonId: '{{lesson.id}}' }
    select: '$'
    sourceType: edstem.lesson_file
    externalId: url
    attach: { courseId: lesson.courseId, lessonId: lesson.id }
    optional: true
    capability: assignments

# get_assignment / verify_submission on an Ed lesson assignment: read that lesson now, with its
# progress, its quiz questions, the student's saved answers and its file list (read-only calls,
# only when asked; no file is downloaded here).
details:
  - sourceType: edstem.lesson
    resource: lessons
    run: [lesson_status, lesson_details, slide_questions, slide_responses, lesson_files]

entities:
  edstem.course:
    - kind: courseOffering
      key: '$string(id)'
      fields:
        title: name
        courseCode: code
        academicYear: 'year ? $number(year)'
        term: '$profileTerm(session, year)'
        url: '"https://edstem.org/" & $vars.region & "/courses/" & id'
      extra: { session: session }
      ref: { url: '"https://edstem.org/" & $vars.region & "/courses/" & id' }

  # Summaries: one thread entity per discussion thread (announcements become announcement entities
  # from their detail instead).
  edstem.thread:
    - kind: thread
      when: '$not(type = "announcement")'
      key: '$string(id)'
      fields:
        title: title
        platform: { const: edstem }
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/discussion/" & id'
        courseOfferingId: { ref: courseOffering, key: '$string(courseId)' }
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/discussion/" & id'

  edstem.thread_detail:
    - kind: announcement
      when: 'type = "announcement"'
      key: '$string(id)'
      fields:
        title: title
        body: document
        publishedAt: createdAt
        authorName: '$lookup(users, $string(userId)).name'
        category: category
        importance: '"pinned" in flags ? "high" : "normal"'
        scope: { const: course }
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/discussion/" & id'
        courseOfferingId: { ref: courseOffering, key: '$string(courseId)' }
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/discussion/" & id'
        authority: instructor-announcement
        location: { messageId: '$string(id)' }

    # The opening post of a discussion thread.
    - kind: message
      when: '$not(type = "announcement")'
      key: '"t" & $string(id)'
      fields:
        body: document
        authorName: '$lookup(users, $string(userId)).name'
        authorRole: >-
          ($r := $lookup(users, $string(userId)).courseRole;
          $r = "admin" ? "instructor" : $r in ["staff", "ta", "tutor"] ? "ta" : "student")
        sentAt: createdAt
        isQuestion: 'type = "question"'
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/discussion/" & id'
        threadId: { ref: thread, key: '$string(id)' }
        courseOfferingId: { ref: courseOffering, key: '$string(courseId)' }
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/discussion/" & id'
        authority:
          expr: >-
            $lookup(users, $string(userId)).courseRole in ["admin", "staff", "ta", "tutor"]
            ? "instructor-announcement" : "discussion"
        location: { messageId: '$string(id)' }

    # Every answer and comment, nested replies included (flattened).
    - kind: message
      forEach: >-
        ($all := function($c) { $c ? $append($c, $all($c.comments)) : [] };
        $all($append(answers ? answers : [], comments ? comments : [])))
      key: '"c" & $string(id)'
      fields:
        body: document
        authorName: '$lookup($root.users, $string(userId)).name'
        authorRole: >-
          ($r := $lookup($root.users, $string(userId)).courseRole;
          $r = "admin" ? "instructor" : ($r in ["staff", "ta", "tutor"] or byStaff = true) ? "ta" :
          "student")
        sentAt: createdAt
        isQuestion: { const: false }
        # Replies to an announcement have no thread entity to point at.
        threadId: { ref: thread, key: '$root.type = "announcement" ? "" : $string($root.id)' }
        courseOfferingId: { ref: courseOffering, key: '$string($root.courseId)' }
        url: '"https://edstem.org/" & $vars.region & "/courses/" & $root.courseId & "/discussion/" & $root.id'
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & $root.courseId & "/discussion/" & $root.id'
        authority:
          expr: >-
            ($lookup($root.users, $string(userId)).courseRole in ["admin", "staff", "ta", "tutor"]
            or byStaff = true) ? "instructor-announcement" : "discussion"
        location: { messageId: '$string(id)' }

    # Files written into the text of the post or of any answer / comment (<file url filename/>).
    - kind: document
      forEach: >-
        ($all := function($c) { $c ? $append($c, $all($c.comments)) : [] };
        $docs := $append(document ? document : [],
        $all($append(answers ? answers : [], comments ? comments : [])).document);
        $distinct($docs.$match($, /<file\s[^>]*>/).match).(
        $u := $replace($match($, /url="([^"]*)"/).groups[0], "&amp;", "&");
        $f := $match($, /filename="([^"]*)"/).groups[0];
        $u ? {"url": $u, "filename": $f ? $replace($f, "&amp;", "&") : $replace($u, /^.*\//, "")}))
      key: '"att:" & url'
      fields:
        title: filename
        url: url
        mimeType: &attachmentMime >-
          $lookup({"pdf": "application/pdf", "png": "image/png", "jpg": "image/jpeg",
          "jpeg": "image/jpeg", "gif": "image/gif", "webp": "image/webp", "txt": "text/plain",
          "csv": "text/csv", "zip": "application/zip",
          "pptx": "application/vnd.openxmlformats-officedocument.presentationml.presentation",
          "docx": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          "xlsx": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"},
          $lowercase($match(filename, /\.([A-Za-z0-9]+)$/).groups[0]))
        path: >-
          "/Ed Discussion/#" & $root.number & " " & $replace($root.title, "/", "／") & "/" &
          $replace(filename, "/", "／")
        courseOfferingId: { ref: courseOffering, key: '$string($root.courseId)' }
      extra:
        platform: '"edstem"'
        edKind: '"attachment"'
        threadId: $root.id
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & $root.courseId & "/discussion/" & $root.id'
        authority: discussion

  edstem.lesson:
    - kind: assignment
      when: >-
        $exists(dueAt) or
        $contains(title, /課題|レポート|宿題|提出|テスト|クイズ|quiz|assignment|homework|report/i)
      key: '$string(id)'
      fields:
        title: title
        dueAt: dueAt
        availableFrom: availableAt
        submissionType: { const: edstem-lesson }
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
        courseOfferingId: { ref: courseOffering, key: '$string(courseId)' }
      extra: { module: moduleName, lessonStatus: status, state: state }
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
        sourceLabel: Ed Lessons
        authority: submission-system
    - kind: submission
      when: >-
        $exists(status) and ($exists(dueAt) or
        $contains(title, /課題|レポート|宿題|提出|テスト|クイズ|quiz|assignment|homework|report/i))
      key: '"l" & $string(id)'
      fields:
        assignmentId: { ref: assignment, key: '$string(id)' }
        status: 'status = "completed" ? "submitted" : "not_submitted"'
      extra: { lessonStatus: status }
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
        sourceLabel: Ed Lessons
        authority: submission-system

  # The lesson's text (every slide in order) for search and get_course.
  edstem.lesson_detail:
    - kind: document
      key: '"lesson:" & $string(id)'
      fields:
        title: title
        text: >-
          $join(slides.(
          ($t := $plainText(content);
          "[" & (title ? title : type) & "]" & ($t ? "\n" & $t : "") &
          (type = "quiz" ? "\n(クイズ: 設問は「" & $root.title & " 質問…」)" : "") &
          (fileUrl ? "\n(ファイル: " & fileUrl & ")" : ""))), "\n\n")
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
        path: >-
          "/Ed Lessons/" & (_parent.moduleName ? $replace(_parent.moduleName, "/", "／") & "/" : "") &
          $replace(title, "/", "／")
        courseOfferingId: { ref: courseOffering, key: '$string(courseId)' }
      extra:
        platform: '"edstem"'
        edKind: '"lesson"'
        lessonId: id
        module: _parent.moduleName
        slideCount: '$count(slides)'
      ref:
        url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
        sourceLabel: Ed Lessons
        authority: lms
    # Ed-hosted slide files (pdf slides): name and link; Ed's file links open without signing in.
    - kind: document
      forEach: 'slides[$exists(fileUrl)]'
      key: '"file:" & $string(id)'
      fields:
        title: '(type = "pdf" and $not($contains(title, /\.pdf$/i))) ? title & ".pdf" : title'
        url: fileUrl
        mimeType: 'type = "pdf" ? "application/pdf"'
        path: >-
          "/Ed Lessons/" & ($root._parent.moduleName ? $replace($root._parent.moduleName, "/", "／") &
          "/" : "") & $replace($root.title, "/", "／") & "/" & $replace(title, "/", "／")
        courseOfferingId: { ref: courseOffering, key: '$string($root.courseId)' }
      extra:
        platform: '"edstem"'
        edKind: '"file"'
        lessonId: $root.id
        slideId: id
      ref:
        url: >-
          "https://edstem.org/" & $vars.region & "/courses/" & $root.courseId & "/lessons/" &
          $root.id & "/slides/" & id
        sourceLabel: Ed Lessons
        authority: lms
    # Files written into a slide's text (<file url filename/>): images, PDFs and documents of the
    # lesson, one document each, fetched on request through `files:` above.
    - kind: document
      forEach: >-
        slides[$exists(content)].($s := $; $match(content, /<file\s[^>]*>/).(
        $u := $replace($match(match, /url="([^"]*)"/).groups[0], "&amp;", "&");
        $f := $match(match, /filename="([^"]*)"/).groups[0];
        $u ? {"url": $u, "filename": $f ? $replace($f, "&amp;", "&") : $replace($u, /^.*\//, ""),
        "slideId": $s.id, "slideTitle": $s.title}))
      key: '"att:" & url'
      fields:
        title: filename
        url: url
        mimeType: *attachmentMime
        path: >-
          "/Ed Lessons/" & ($root._parent.moduleName ? $replace($root._parent.moduleName, "/", "／") &
          "/" : "") & $replace($root.title, "/", "／") & "/" & $replace(filename, "/", "／")
        courseOfferingId: { ref: courseOffering, key: '$string($root.courseId)' }
      extra:
        platform: '"edstem"'
        edKind: '"attachment"'
        lessonId: $root.id
        slideId: slideId
      ref:
        url: >-
          "https://edstem.org/" & $vars.region & "/courses/" & $root.courseId & "/lessons/" &
          $root.id & "/slides/" & slideId
        sourceLabel: Ed Lessons
        authority: lms

  # One quiz question: 「<lesson> 質問<n>」 with its prompt and choices (never the answer key).
  edstem.slide_question:
    - kind: document
      key: '"question:" & $string(id)'
      fields:
        title: >-
          _parent.lessonTitle & (_parent.quizSlides > 1 ? " " & _parent.slideTitle : "") & " 質問" &
          $string(number)
        text: >-
          $plainText(content) & ($count(answers) > 0 ? "\n選択肢:\n" &
          $join($map(answers, function($a, $i) { $string($i + 1) & ". " & $plainText($a) }), "\n") : "")
        url: >-
          "https://edstem.org/" & $vars.region & "/courses/" & _parent.courseId & "/lessons/" &
          _parent.lessonId & "/slides/" & slideId
        path: >-
          "/Ed Lessons/" & (_parent.moduleName ? $replace(_parent.moduleName, "/", "／") & "/" : "") &
          $replace(_parent.lessonTitle, "/", "／") & "/質問" & $string(number)
        courseOfferingId: { ref: courseOffering, key: '$string(_parent.courseId)' }
      extra:
        platform: '"edstem"'
        edKind: '"question"'
        lessonId: _parent.lessonId
        slideId: slideId
        questionNumber: number
        questionType: type
      ref:
        url: >-
          "https://edstem.org/" & $vars.region & "/courses/" & _parent.courseId & "/lessons/" &
          _parent.lessonId & "/slides/" & slideId
        sourceLabel: Ed Lessons
        authority: lms

  # Files and images in the student's own saved answer (<file url filename/>, <image src/>): one
  # document each, opened on request through `files:` (get_document, verify_submission). Never
  # fetched by a sync: the answers themselves are only read on request.
  edstem.slide_response:
    - kind: document
      forEach: >-
        ($doc := $type(data) = "string" ? data : data.content;
        $type($doc) = "string" ? $append(
        $match($doc, /<file\s[^>]*>/).(
        $u := $replace($match(match, /url="([^"]*)"/).groups[0], "&amp;", "&");
        $f := $match(match, /filename="([^"]*)"/).groups[0];
        $u ? {"url": $u, "filename": $f ? $replace($f, "&amp;", "&") : $replace($u, /^.*\//, "")}),
        $match($doc, /<image\s[^>]*>/).(
        $u := $replace($match(match, /src="([^"]*)"/).groups[0], "&amp;", "&");
        $u ? {"url": $u, "filename": "画像 " & $replace($u, /^.*\//, "")})))
      key: '"resp:" & url'
      fields:
        title: filename
        url: url
        # pasted images have no extension in their name: the type comes from the bytes later
        mimeType: *attachmentMime
        path: >-
          "/Ed Lessons/" & ($root._parent.moduleName ? $replace($root._parent.moduleName, "/", "／") &
          "/" : "") & $replace($root._parent.lessonTitle, "/", "／") & "/提出/" &
          $replace(filename, "/", "／")
        courseOfferingId: { ref: courseOffering, key: '$string($root._parent.courseId)' }
      extra:
        platform: '"edstem"'
        edKind: '"response-file"'
        lessonId: $root._parent.lessonId
        slideId: $root._parent.slideId
        questionId: $root.questionId
        savedAt: $root.createdAt
      ref:
        url: >-
          "https://edstem.org/" & $vars.region & "/courses/" & $root._parent.courseId & "/lessons/" &
          $root._parent.lessonId & "/slides/" & $root._parent.slideId
        sourceLabel: Ed Lessons
        authority: submission-system

facts:
  # 「提出期限: 10月6日 17:00PM」 in the lesson text, when Ed itself has no due date.
  - sourceType: edstem.lesson_detail
    when: >-
      $not($exists(dueAt)) and
      $contains(title, /課題|レポート|宿題|提出|テスト|クイズ|quiz|assignment|homework|report/i) and
      $exists($extractDeadline($plainText($append(outline, slides.content)), availableAt ? availableAt : createdAt))
    subject: { ref: assignment, key: '$string(id)' }
    predicate: assignment_due
    value:
      expr: '$extractDeadline($plainText($append(outline, slides.content)), availableAt ? availableAt : createdAt).dueAt'
      as: datetime
    origin: extracted
    confidence: 0.9
    evidence: '$extractDeadline($plainText($append(outline, slides.content)), availableAt ? availableAt : createdAt).evidence'
    observedAt: 'updatedAt ? updatedAt : createdAt'
    ref:
      url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
      sourceLabel: Ed Lessons
      authority: submission-system
  # Ed's hard close (lockedAt: no submissions after it) is the due date when nothing else states one.
  - sourceType: edstem.lesson_detail
    when: >-
      $not($exists(dueAt)) and $exists(lockedAt) and
      $contains(title, /課題|レポート|宿題|提出|テスト|クイズ|quiz|assignment|homework|report/i) and
      $not($exists($extractDeadline($plainText($append(outline, slides.content)), availableAt ? availableAt : createdAt)))
    subject: { ref: assignment, key: '$string(id)' }
    predicate: assignment_due
    value: { expr: lockedAt, as: datetime }
    evidence: '"Ed lesson locks at " & lockedAt'
    ref:
      url: '"https://edstem.org/" & $vars.region & "/courses/" & courseId & "/lessons/" & id'
      sourceLabel: Ed Lessons
      authority: submission-system

drift:
  edstem.course: { id: number, name: string, 'code?': 'string|null' }
  edstem.thread:
    { id: number, courseId: number, title: string, type: string, 'createdAt?': 'string|null' }
  edstem.thread_detail: { id: number, courseId: number, userId: number, document: string }
  edstem.lesson:
    { id: number, courseId: number, title: string, 'status?': string, 'dueAt?': string }
  edstem.lesson_detail: { id: number, courseId: number, title: string }
  edstem.slide_question: { id: number, slideId: number, content: string, 'answers?': [string] }
  edstem.slide_response: { questionId: number }
  edstem.lesson_file: { url: string, filename: string }
