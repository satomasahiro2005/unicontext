# Shizuoka University deployment profile (§54, §76).
# Settings only. Product logic lives in connectors/*; Shizuoka screen ids and hosts live in each
# connector's deployment module (src/profiles/shizuoka.ts) selected by `deployment: shizuoka`.
# Observations behind these values: docs/research/shizuoka.md.
id: shizuoka-university
name: 静岡大学
locale: ja-JP
academicCalendar:
  timezone: Asia/Tokyo
  # Period = LiveCampusU 時限 pair index (1 = 1・2限 … 7 = 13・14限); every connector uses this.
  # 1–5 (day) match the university's published 授業時間区分 (8:40 start, 90-minute periods; lunch
  # 11:50–12:45). 6–7 are the 夜間主コース times of the 人文社会科学部 (17:50–19:20, 19:30–21:00)
  # from the student handbook; they may differ by campus — verify if you have evening classes.
  periods:
    - { period: 1, start: '08:40', end: '10:10' }
    - { period: 2, start: '10:20', end: '11:50' }
    - { period: 3, start: '12:45', end: '14:15' }
    - { period: 4, start: '14:25', end: '15:55' }
    - { period: 5, start: '16:05', end: '17:35' }
    - { period: 6, start: '17:50', end: '19:20' }
    - { period: 7, start: '19:30', end: '21:00' }
  # 学年暦 and class days from the university's 令和8年度 行事予定表 (昼間コース, version 2026-02-09):
  # https://www.shizuoka.ac.jp/education/affairs/schedule/document/r08_schedule.pdf
  # Each weekday has 15 meetings + 1 exam (16) per term. `classes` = 授業開始 … last regular class,
  # `exams` = 定期試験 incl. 予備日. 夜間主コース (Saturday classes, other dates) is not modelled.
  source: 令和8年度 行事予定表（静岡大学, 2026-02-09版）
  terms:
    - id: '2026-1'
      name: '2026年度 前期'
      termCode: 前期
      year: 2026
      start: '2026-04-01'
      end: '2026-09-30'
      classes: { start: '2026-04-13', end: '2026-07-24' }
      exams: { start: '2026-07-27', end: '2026-08-03' }
    - id: '2026-2'
      name: '2026年度 後期'
      termCode: 後期
      year: 2026
      start: '2026-10-01'
      end: '2027-03-31'
      classes: { start: '2026-10-01', end: '2027-01-28' }
      exams: { start: '2027-01-29', end: '2027-02-05' }
  # Weekdays inside the class weeks without regular classes. `campus`/`faculty` entries apply only
  # when config.yaml names that campus/faculty under `student:`; otherwise they are shown as notes.
  noClassDays:
    - { date: '2026-04-29', note: 昭和の日 }
    - { date: '2026-05-04', note: みどりの日 }
    - { date: '2026-05-05', note: こどもの日 }
    - { date: '2026-05-06', note: 振替休日 }
    - { date: '2026-07-20', note: 海の日（補講日） }
    - { date: '2026-10-12', note: スポーツの日 }
    - { date: '2026-10-30', note: 大学祭（静岡地区休講）, campus: 静岡 }
    - { date: '2026-11-03', note: 文化の日 }
    - { date: '2026-11-06', note: 大学祭準備（浜松地区休講）, campus: 浜松 }
    - { date: '2026-11-23', note: 勤労感謝の日 }
    - { date: '2026-12-22', note: 集中講義期間 }
    - { date: '2026-12-23', note: 集中講義期間 }
    - { date: '2026-12-24', note: 集中講義期間 }
    - { date: '2026-12-25', note: 集中講義期間 }
    - { date: '2026-12-28', note: 冬季一斉休業 }
    - { date: '2026-12-29', note: 冬季休業 }
    - { date: '2026-12-30', note: 冬季休業 }
    - { date: '2026-12-31', note: 冬季休業 }
    - { date: '2027-01-01', note: 元日 }
    - { date: '2027-01-07', note: 大学入学共通テスト監督者説明会（対面授業等なし） }
    - { date: '2027-01-11', note: 成人の日 }
    - date: '2027-01-15'
      note: 大学入学共通テスト設営（7・8限以降の専門科目は休講）
      faculty: 情報学部
      fromPeriod: 4
    - { date: '2027-01-21', note: 補講日 }
  substituteDays:
    - { date: '2026-05-07', dayOfWeek: 3, note: 水曜授業 }
    - { date: '2026-06-01', dayOfWeek: 1, note: 創立記念日（授業あり） }
    - { date: '2026-07-17', dayOfWeek: 1, note: 月曜授業 }
    - { date: '2026-11-25', dayOfWeek: 1, note: 月曜授業 }

# 履修登録の上限単位数. Observed on the LCU registration screen (履修登録 > 履修単位サマリ,
# 上限単位数 今学期 24.0 / 年間 -) in 2026, see docs/research/lcu-registration.md §8. The screen
# applies it to 履修制限科目 only (履修制限外科目 are counted separately), so it is not a cap on the
# total number of credits a student can take.
registration:
  creditCap:
    perTerm: 24
    note: 履修登録画面の上限単位数（2026年に確認）。履修制限科目の登録単位にかかり、履修制限外科目は別枠。

# Role → product (+ how to connect). `connector` = package dir; `module` picks one of several modules
# in a package (docs/connectors/README.md).
sources:
  academic: { product: livecampusu, connector: livecampusu, schedule: 15m }
  collaboration: { product: microsoft365, connector: microsoft365, schedule: 15m }
  syllabus: { product: syllabus, connector: syllabus, schedule: 1d }
  cancellations:
    product: lcu-public-cancellations
    connector: syllabus
    module: public-cancellations
    schedule: 15m
  portal: { product: wordpress-portal, connector: wordpress-portal, schedule: 1h }
  files: { product: local-files, connector: local-files, schedule: event }
  lectures: { product: chatgpt-record, connector: chatgpt-record, schedule: event }
  # EdStem is not in the university's guidance (research §6); individual courses may use it.
  # Disabled by default; enable it in config.yaml with an EdStem MCP server command.
  discussion:
    product: edstem
    connector: adapter-mcp
    adapter: mcp
    enabled: false
    mapping: edstem-mcp.yaml

products:
  livecampusu:
    deployment: shizuoka
    # Browser SSO: Shibboleth IdP (idp.shizuoka.ac.jp) → Entra ID + MFA, done by the human once.
    # The hidden local-account form is never used (CONNECTOR_POLICY.md).
    auth: browser-sso
    allowLocalAccount: false
    sourceLabel: 学務情報システム
    # The FAQ mentions a nightly stop without times; this window is a conservative assumption.
    maintenanceWindow: '01:00-06:00'
    idleTimeoutMinutes: 60
  microsoft365:
    tenant: e0d7dc00-4621-4fe0-90b1-df7b1b40b351
    tenantHint: shizuoka.ac.jp
    sourceLabel: Microsoft 365
    # clientId is user-supplied (app registration by students is allowed; user consent policy is
    # unverified — see docs/connectors/microsoft365.md).
  syllabus:
    deployment: shizuoka
    sourceLabel: シラバス
  lcu-public-cancellations:
    deployment: shizuoka
    sourceLabel: 休講案内
  wordpress-portal:
    deployment: shizuoka
    label: 学生教務ポータル
  local-files:
    sourceLabel: ローカルファイル
  chatgpt-record:
    sourceLabel: ChatGPT Record

privacy:
  # Student IDs are redacted from logs. Pattern is intentionally broad (8 alphanumerics).
  studentIdPattern: "\\b[0-9]{2}[0-9A-Z][0-9]{5}\\b"
